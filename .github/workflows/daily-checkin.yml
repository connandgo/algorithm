name: Daily Solve Check-in

on:
  schedule:
    # GitHub scheduled runs may be delayed or dropped. Retry from 08:00 to 08:50 KST;
    # the daily cache below ensures Slack is notified only once.
    - cron: "0,10,20,30,40,50 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-solve-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set KST date
        id: date
        env:
          TZ: Asia/Seoul
        run: echo "kst=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check today's notification marker
        if: github.event_name == 'schedule'
        id: notification-cache
        uses: actions/cache/restore@v4
        with:
          path: .daily-checkin-marker
          key: daily-checkin-${{ steps.date.outputs.kst }}

      - name: Check yesterday's commits and notify Slack
        if: github.event_name == 'workflow_dispatch' || steps.notification-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          USERS: connandgo,dokwon33
        run: python scripts/check_daily_solve.py

      - name: Create today's notification marker
        if: github.event_name == 'schedule' && steps.notification-cache.outputs.cache-hit != 'true'
        run: touch .daily-checkin-marker

      - name: Save today's notification marker
        if: github.event_name == 'schedule' && steps.notification-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .daily-checkin-marker
          key: daily-checkin-${{ steps.date.outputs.kst }}
